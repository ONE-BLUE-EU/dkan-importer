[package]
name = "importer-lib"
version.workspace = true
edition = "2024"

[features]
# Feature flag for test utilities (automatically enabled during testing)
test = []

[dependencies]
# Excel reader
calamine.workspace = true
# Excel writer
rust_xlsxwriter.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
csv.workspace = true
jsonschema.workspace = true

# For re-exporting
reqwest.workspace = true
log.workspace = true
loose-dms.workspace = true


[dev-dependencies]
proptest.workspace = true

# Automatically enable test feature during testing
# This ensures test_utils is only compiled when running tests
[dev-dependencies.importer-lib]
path = "."
features = ["test"]
